[project]
name = "hotbox"
version = "2.0.0"
description = "Houdini hotbox: context aware launcher for your Python scripts"
readme = "README.md"
# Houdini 21 ships Python 3.11
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # Houdini 21 uses PySide6 (Qt6); used for offscreen GUI smoke tests
    "pyside6>=6.5",
]

[tool.uv]
# Not an installable package: Houdini imports the folder directly from its python path
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
